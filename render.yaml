services:
  # 1. Frontend Static Site (React 19 + Tailwind SPA on Render Free Tier)
  - type: web
    name: quickbooks-india-ui
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quickbooks-india-api
          property: url

  # 2. Backend Web Service (Express API + Continuous Accounting Engine on Render Free Tier)
  - type: web
    name: quickbooks-india-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/dashboard/metrics
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: quickbooks-india-ui
          property: url
